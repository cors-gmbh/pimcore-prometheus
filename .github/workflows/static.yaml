name: Static Tests

# Modelled on the CORS dev-harness caller (cors-gmbh/shared-workflows-private,
# templates/harness/static.yaml). This repo is not in that sync group (Pimcore 12 line, the
# instance identifier is fixed in config/license.yaml). Pimcore 12.3 validates the registration
# when the container compiles, so the repository secrets PIMCORE_ENCRYPTION_SECRET and
# PIMCORE_PRODUCT_KEY must belong to that identifier.
# The repo is public, so COMPOSER_AUTH does not arrive here: every dependency must come from
# packagist.org (tooling via coreshop/test-setup instead of the private cors/dev).

on:
  push:
    branches: [ '*.x', main ]
  pull_request:
    branches: [ '*.x', main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: cors-gmbh/shared-workflows/.github/workflows/php-test.yaml@main
    with:
      # single source of truth for the PHP version: DOCKER_PHP_VERSION in .env
      versions-from-env: true
      phpstan: true
      psalm: true
      ecs-paths: 'src'
      psalm-paths: 'src'
      lint-yaml-paths: 'config src/Resources/config'
      lint-twig-paths: 'templates'
    secrets:
      # Pimcore refuses to boot without a registered instance; php-test writes this to .env.local.
      env_local: |
        PIMCORE_ENCRYPTION_SECRET=${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
        PIMCORE_PRODUCT_KEY=${{ secrets.PIMCORE_PRODUCT_KEY }}
